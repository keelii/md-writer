<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Writing</title>
  <script src="./dist/index.js"></script>
  <link rel="stylesheet" href="./dist/index.css" />

  <link rel="preload" href="./static/katex/katex.min.css" as="style" />
  <link rel="preload" href="./static/katex/katex.min.js" as="script" />

  <link rel="preload" href="./static/mermaid/mermaid.tiny.js" as="script" />
  <link rel="preload" href="./static/svg-pan-zoom/svg-pan-zoom.min.js" as="script" />
  
  <link rel="preload" href="./static/katex/fonts/KaTeX_Size2-Regular.woff2" as="font" />
  <link rel="preload" href="./static/katex/fonts/KaTeX_Main-Regular.woff2" as="font" />
  <link rel="preload" href="./static/katex/fonts/KaTeX_Math-Italic.woff2" as="font" />

</head>
<body>
  <div class="md-editor theme-default"></div>
  <script>
    var initialMarkdown = '---\ntitle: MD Writer 全功能测试\nauthor: keelii\ndate: 2026-10-10\n---\n\n# 一级标题 Heading 1\n\n## 二级标题（TOC 可见）\n\n### 三级标题\n\n#### 四级标题（TOC 可见）\n\n##### 五级标题（TOC 可见）\n\n###### 六级标题（TOC 可见）\n\n## 行内格式\n\n**加粗**、*斜体*、***粗斜体***、~~删除线~~、`行内代码`、[普通链接](https://example.com)、[带代码的链接](https://example.com)\n\n转义字符：\\*不是斜体\\*、竖线 |、井号 #\n\n行尾两个空格硬换行  \n下一行内容\n\n## 行内 HTML 标记\n\n<u>下划线</u>、<mark>高亮</mark>、H<sub>2</sub>O、E=mc<sup>2</sup>、<kbd>Ctrl</kbd>+<kbd>S</kbd>、<abbr title=\"Cascading Style Sheets\">CSS</abbr>\n\n## 数学公式\n\n行内公式 $E = mc^2$ 与 $\\alpha + \\beta = \\gamma$\n\n$$\n\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}\n$$\n\n<div>\n$$\n\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}\n$$\n</div>\n\n## 列表\n\n* 无序一\n* 无序二\n  * 嵌套一层\n    * 嵌套两层\n\n1. 有序一\n2. 有序二\n   1. 嵌套有序\n   2. 第二项\n\n## 引用\n\n> 一级引用\n>\n> > 嵌套引用\n>\n> 引用内 **加粗** 与 `代码`\n\n## 代码块\n\n```javascript\nvar MD5 = function (str) {\n  var hasher = crypto.createHash(\"md5\")\n  hasher.update(str)\n  return hasher.digest(\"hex\")\n}\n```\n\n```python\ndef fib(n):\n    a, b = 0, 1\n    while a < n:\n        print(a, end=\" \")\n        a, b = b, a + b\n```\n\n```ts\ntype EditorMode = \"wysiwyg\" | \"source\"\n\nexport function createEditor(mode: EditorMode): void {\n  const mount = document.querySelector(\".md-editor\")\n  console.log(\"init editor in\", mode, \"mode\", mount)\n}\n```\n\n```bash\nnpm install\nnpm run dev\n```\n\n代码块支持语法高亮（js/ts/py/bash/css/html 等常用语言）、语言切换菜单与复制按钮。\n\n## 表格\n\n分隔行支持 GFM 列对齐：`:---` 左对齐、`:---:` 居中、`---:` 右对齐。\n\n| 功能 | 快捷键 | 说明 |\n| :--- | :---: | ---: |\n| 加粗 | Ctrl+B | 切换 **粗体** |\n| 斜体 | Ctrl+I | 单元格<br>内换行 |\n| 转义 | Ctrl+E | 竖线 \\| 转义 |\n\n表格内可加行、删行、加列、删列、上移/下移行、左移/右移列。\n\n## Mermaid 图\n\n```mermaid\nflowchart LR\n    A[Markdown 源码] --> B{解析}\n    B -->|CodeMirror| C[源码编辑]\n    B -->|ProseMirror| D[富文本]\n    C --> E[TOC 生成]\n    D --> E\n```\n\n## 纯 SVG 预览\n\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 240 120\" width=\"240\"><rect width=\"240\" height=\"120\" fill=\"#eef2ff\" rx=\"8\"/><circle cx=\"60\" cy=\"60\" r=\"28\" fill=\"#6366f1\"/><path d=\"M110 90 L150 30 L190 90 Z\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"6\" stroke-linejoin=\"round\"/><text x=\"92\" y=\"66\" font-size=\"14\" fill=\"#334155\">SVG 预览</text></svg>\n\n## 脚注\n\n这是一个脚注引用[^1]，还有第二个[^note]。\n\n[^1]: 第一个脚注的定义，支持 **加粗** 等行内格式。\n[^note]: 第二个脚注，续行以四个空格缩进。\n    这是脚注的续行。\n\n## 嵌入 iframe\n\n<iframe src=\"https://www.youtube.com/embed/ihaB8AFOhZo\" title=\"YouTube 视频示例\" loading=\"lazy\" allowfullscreen></iframe>\n\n> One last question: Suppose Lord Russell this film were to be looked at by our descendants, like a Dead Sea scroll in a thousand years time, what would you think it\'s worth telling that generation about the life you\'ve lived and  the lessons you\'ve learned from it?\n>\n> BERTRAND RUSSELL\n>\n> > I should like to say two things, one **intellectual** and one  **moral**:\n>\n> The intellectual thing, I should want to say to them, is this:\n>\n> > When you are studying any matter, or considering any philosophy, ask yourself **only** \"what are the facts, and what is the  truth that the facts bear out?\" Never let yourself be diverted, either by what you wish to believe, or by what you think could have beneficial social effects, if it were believed. But look **only** and **solely** at: \"What are the facts?\" That is the intellectual thing that I should wish to  say.\n>\n> The moral thing I should wish to say to them is very simple.\n>\n> > I should say: Love is wise, hatred is foolish. In this world, which is getting more and more closely interconnected, we have to learn to tolerate each other. We have to learn to put up with the fact, that some people say things that we don\'t like. We can **only** live together in that way. And if we are to live together and not to die together, we must learn a kind of charity and a kind of tolerance, which is absolutely vital to the continuation of human life on this planet.\n\n## 图片\n\n![示例图片](https://i.v2ex.co/5pBhVU5h.jpeg)\n\n---\n\n以上覆盖 MD Writer 当前实现的全部 Markdown 功能。'
    const mdEditor = MDWriter.init({
      mount: '.md-editor',
      initialMarkdown: initialMarkdown,
      storage: "localStorage",
      rawPreview: true,
      tocMaxDepth: 6,
      defaultShowRhythmGrid: true,
      onChange: (value) => {},
    });
  </script>

</body>
</html>
