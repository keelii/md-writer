name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v ]]; then TAG="v${GITHUB_RUN_NUMBER}"; fi
          mkdir -p release
          cp index.html release/
          cp -r dist release/dist
          cp -r static release/static
          cd release
          zip -r "../md-writer-${TAG}.zip" .
          cd ..

      - name: Create GitHub Release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v ]]; then TAG="v${GITHUB_RUN_NUMBER}"; fi
          gh release create "${TAG}" "md-writer-${TAG}.zip" \
            --title "md-writer ${TAG}" \
            --notes "自动构建：commit ${GITHUB_SHA}。包含 index.html、dist 构建产物与 static 静态资源。" \
            --latest